<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HANSB Trading Company - Coffee Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HANSB Trading">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">

  <title>HANSB Trading Company</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    body {
      margin: 0;
      background: #6F4E37;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: #6F4E37;
      transition: opacity 0.6s ease-out;
    }
    
    #splash-container.hide {
      opacity: 0;
      pointer-events: none;
    }
    
    #splash-logo {
      width: 180px;
      height: 180px;
      border-radius: 25px;
      object-fit: cover;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
      background: white;
      animation: fadeInScale 0.6s ease-out;
    }
    
    #splash-company {
      margin-top: 35px;
      text-align: center;
      animation: fadeIn 0.6s ease-out 0.2s both;
    }
    
    #splash-company h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 900;
      color: white;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    #splash-company p {
      margin: 10px 0 0 0;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 2.5px;
    }
    
    #splash-progress {
      margin-top: 50px;
      width: 260px;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
      animation: fadeIn 0.6s ease-out 0.4s both;
    }
    
    #splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      border-radius: 3px;
      animation: progressBar 2s ease-out;
    }
    
    #splash-footer {
      position: fixed;
      bottom: 35px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      animation: fadeIn 0.6s ease-out 0.6s both;
    }
    
    #splash-footer strong {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 700;
    }
    
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes progressBar {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById('splash-container');
      const footer = document.getElementById('splash-footer');
      
      if (splash) {
        splash.classList.add('hide');
        setTimeout(() => {
          splash.remove();
          if (footer) footer.remove();
        }, 600);
      }
      
      document.body.style.background = "transparent";
    }
    
    // Auto-remove splash after 2.5 seconds
    window.addEventListener('load', function() {
      setTimeout(removeSplashFromWeb, 2500);
    });
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <!-- Professional Splash Screen -->
  <div id="splash-container">
    <img id="splash-logo" src="favicon.png" alt="HANSB Logo">
    <div id="splash-company">
      <h1>HANSB TRADING</h1>
      <p>COFFEE FACTORY</p>
    </div>
    <div id="splash-progress">
      <div id="splash-progress-bar"></div>
    </div>
  </div>
  <div id="splash-footer">
    Powered by <strong>Infinitech Innovations</strong>
  </div>
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
